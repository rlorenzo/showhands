name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# No job writes to the repo; the deploy job authenticates to the droplet
# with its own SSH key rather than GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the fallow regression gate can diff against the base.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Fallow regression gate (fails on newly-introduced findings)
        # Pass context through env, never inlined into the script, so a branch
        # name can't inject shell (GitHub Actions security hardening).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base=FETCH_HEAD
          else
            base=HEAD~1
          fi
          echo "Auditing changed files against $base"
          npx fallow audit --base "$base"

      - name: Fallow full report (complexity · duplication · dead code, non-blocking)
        run: npx fallow
        continue-on-error: true

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        env:
          # the repo default skips downloads for pre-provisioned containers;
          # CI has no pre-installed browser, so allow the download here
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    name: Deploy to droplet
    needs: [checks, e2e]
    if: github.repository == 'rlorenzo/showhands' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by the failure reporter below to open/comment the tracking issue.
      issues: write
    env:
      # Job-level so the post-deploy check can gate on it too: a step's own env
      # is not visible to that step's `if`.
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DROPLET: 24.199.115.162
      SITE: https://showhands.rexlorenzo.com
    steps:
      - name: Deploy over SSH (droplet runs the deploy via forced command)
        run: |
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "DEPLOY_SSH_KEY not set - skipping deploy (checks still ran)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DROPLET" >> ~/.ssh/known_hosts 2>/dev/null
          # The CI key is pinned to a forced command on the droplet, so this
          # connection runs the deploy regardless of the command sent.
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            root@"$DROPLET" deploy

      # Independent confirmation from outside the droplet: the public site must
      # serve the commit this run pushed. deploy.sh asserts the same thing
      # locally, but a green deploy job is not proof the public URL moved -
      # Caddy, a stale process, or a half-applied restart all survive it.
      - name: Verify the live site serves this commit
        if: ${{ env.DEPLOY_SSH_KEY != '' }}
        run: |
          served=$(curl -fsS --max-time 20 "$SITE/healthz" | jq -r .commit)
          echo "expected: $GITHUB_SHA"
          echo "served:   $served"
          [ "$served" = "$GITHUB_SHA" ] || {
            echo "::error::Live site is serving $served, not $GITHUB_SHA"
            exit 1
          }

      # A red run on a repo nobody watches goes unread, and a failed deploy
      # leaves the site answering 200 with old code. File one issue and keep
      # commenting on it, so repeats escalate in one thread instead of spamming.
      - name: Report a failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Deploy failed for \`${GITHUB_SHA:0:7}\` on \`$GITHUB_REF_NAME\`.

          Run: $RUN_URL

          The site may still answer 200 while serving an older commit. Check what
          is actually live with:

              curl -s $SITE/healthz"
          existing=$(gh issue list --label deploy-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            # `|| true` for the already-exists case; stderr is kept so a real
            # auth/permission failure is still visible in the log.
            gh label create deploy-failure --color b60205 \
              --description "Automated: a deploy to the droplet failed" || true
            gh issue create --title "Deploy to droplet is failing" \
              --label deploy-failure --body "$body"
          fi
